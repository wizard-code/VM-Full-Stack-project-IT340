<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BakeBoard</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="bb-container" style="max-width:420px; margin-top:60px;">
    <div class="bb-card">
        <h2>Forgot Password</h2>
        <p>Enter your account email to generate a password reset link.</p>
        <form id="forgotForm" class="bb-form">
            <input type="email" id="email" placeholder="Email address" required>
            <button type="submit" class="bb-btn">Request Reset Link</button>
        </form>
        <div id="statusMsg" style="margin-top:14px;"></div>
        <p style="margin-top:16px;"><a href="Loginpage.html">Back to Login</a></p>
    </div>
</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const status = document.getElementById("statusMsg");
    status.textContent = "Processing...";

    const res = await fetch("forgot_password.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("email").value })
    });
    const data = await res.json();

    if (!res.ok) {
        status.textContent = data.error || "Request failed";
        return;
    }

    status.innerHTML = data.reset_link
        ? `<p>${data.message}</p><a class="bb-btn" href="${data.reset_link}">Reset Password Now</a>`
        : `<p>${data.message}</p>`;
});
</script>
</body>
</html>
