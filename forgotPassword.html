<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Forgot Password</title>
    <script>
        (() => { const t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); })();
    </script>
    <link href="theme.css" rel="stylesheet">
    <link href="forgotPwd.css" rel="stylesheet">
</head>
<body>
    <main>
        <h1>Forgot Password</h1>
        <form>
            <label for="code">Enter code from Email</label>
            <input type="text" id="code" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
            <input type="submit" value="Submit">
        </form>
    </main>
</body>
</html>
