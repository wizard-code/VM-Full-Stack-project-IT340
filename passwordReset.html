<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - BakeBoard</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="bb-container" style="max-width:420px; margin-top:60px;">
    <div class="bb-card">
        <h2>Set New Password</h2>
        <form id="resetForm" class="bb-form">
            <input type="password" id="newPass" placeholder="New password (min 8 chars)" minlength="8" required>
            <input type="password" id="confirmPass" placeholder="Confirm new password" minlength="8" required>
            <button type="submit" class="bb-btn">Update Password</button>
        </form>
        <div id="statusMsg" style="margin-top:14px;"></div>
        <p style="margin-top:16px;"><a href="Loginpage.html">Back to Login</a></p>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token") || "";

document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const status = document.getElementById("statusMsg");
    const pw = document.getElementById("newPass").value;
    const confirm = document.getElementById("confirmPass").value;

    if (pw !== confirm) {
        status.textContent = "Passwords do not match.";
        return;
    }

    const res = await fetch("reset_password.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password: pw })
    });
    const data = await res.json();

    if (!res.ok) {
        status.textContent = data.error || "Reset failed";
        return;
    }

    status.textContent = data.message;
    setTimeout(() => { window.location.href = "Loginpage.html"; }, 1500);
});
</script>
</body>
</html>
